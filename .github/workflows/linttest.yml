name: Testing and Linting
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # This will run bandit and produce a security report if there are any failures
  linting:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        pyver: ["3.12", "3.13", "3.14"]
        
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.pyver }}
      - name: Check lockfile is up to date
        run: uv lock --check
      - name: Install Dependencies
        run: uv sync --extra dev --extra test
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typing (ty)
        run: uv run ty check .
      - name: Security scan (bandit)
        run: uv run bandit -c pyproject.toml -r src/

  # This will run pytest against the specified version
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pyver: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.pyver }}

      - name: Install Podman (matches cactus-deploy/server/setup.sh exactly)
        run: |
          sudo apt-get update
          # aardvark-dns + netavark: container name resolution/networking on cactus-net
          # catatonit: PID 1 init for pod infra containers; `podman pod create` fails without it
          # uidmap (newuidmap/newgidmap), for userns=auto, comes via apt Recommends
          sudo apt-get install -y podman aardvark-dns netavark catatonit
          podman --version

      - name: Allocate subuid/subgid range for the 'containers' user (required for userns=auto)
        run: |
          # Rootful userns=auto draws IDs from a user named "containers", not root
          # (see cactus-deploy/server/README.md). Some podman builds resolve it via NSS.
          sudo useradd --system --no-create-home containers || true
          grep -q '^containers:' /etc/subuid || echo "containers:11000000:1048576" | sudo tee -a /etc/subuid
          grep -q '^containers:' /etc/subgid || echo "containers:11000000:1048576" | sudo tee -a /etc/subgid
          sudo podman system migrate

      - name: Enable rootful podman socket
        run: |
          sudo systemctl enable --now podman.socket
          sudo systemctl status podman.socket --no-pager

      - name: Grant current user access to the root socket
        run: |
          sudo chmod 777 /run/podman/
          sudo chmod 777 /run/podman/podman.sock
          ls -l /run/podman/podman.sock

      - name: Install Dependencies
        run: uv sync --extra test

      - name: Run Pytest
        run: uv run pytest -n auto

      - name: Debug podman/conmon journal (on failure)
        if: failure()
        run: |
          sudo journalctl -u podman --no-pager -n 500
          sudo journalctl --no-pager -n 500 | grep -i "conmon\|crun\|oci runtime" || true

      