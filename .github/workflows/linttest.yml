name: Testing and Linting
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # This will run bandit and produce a security report if there are any failures
  linting:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        pyver: ["3.12", "3.13", "3.14"]
        
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.pyver }}
      - name: Check lockfile is up to date
        run: uv lock --check
      - name: Install Dependencies
        run: uv sync --extra dev --extra test
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typing (ty)
        run: uv run ty check .
      - name: Security scan (bandit)
        run: uv run bandit -c pyproject.toml -r src/

  # This will run pytest against the specified version
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pyver: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.pyver }}

      - name: Install Podman
        run: |
          sudo apt-get update
          # uidmap (newuidmap/newgidmap) is only a Recommends of podman. Without it userns=auto can't build the ID
          # mapping and podman fails with "not enough unused IDs in user namespace"
          sudo apt-get install -y podman uidmap

      - name: Allocate subuid/subgid range for root (required for userns=auto)
        run: |
          echo "root:100000:1048576" | sudo tee -a /etc/subuid
          echo "root:100000:1048576" | sudo tee -a /etc/subgid

      - name: Enable rootful podman socket
        run: |
          sudo systemctl enable --now podman.socket
          sudo systemctl status podman.socket --no-pager

      - name: Grant current user access to the root socket
        run: |
          sudo chmod 777 /run/podman/
          sudo chmod 777 /run/podman/podman.sock
          ls -l /run/podman/podman.sock

      - name: Debug podman userns pod creation
        run: |
          sudo podman pod create --userns=auto --name debug-userns-pod
          sudo podman pod rm -f debug-userns-pod
          sudo journalctl -u podman --no-pager -n 200

      - name: Install Dependencies
        run: uv sync --extra test

      - name: Run Pytest
        run: uv run pytest -n auto

      